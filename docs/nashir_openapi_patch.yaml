openapi: 3.1.0
info:
  title: Marketing OS — Nashir Slice 0 OpenAPI Patch
  version: 0.1.0-nashir-slice0
  description: |
    Nashir Slice 0 OpenAPI patch. Defines the minimum campaign/intake path surface
    required before any Nashir route can be registered in src/router.js.

    This patch does NOT activate routes. Route registration in src/router.js remains
    NO-GO until a separately approved route implementation scope gate is merged and
    store entities and service/repository behavior are separately approved.

    No generated client update is included in this patch.
    Generated-client changes require a separately approved gate.
    This read/list lifecycle patch keeps generated-client changes NO-GO.

    Nashir RBAC codes implemented in PR #166:
      nashir.campaign.read   — used by GET operations in this patch
      nashir.campaign.write  — used by POST operation in this patch
      nashir.evidence.submit — deferred; not exposed in this patch
      nashir.approval.decide — deferred; not exposed in this patch

    Deferred paths (not in this patch):
      nashir evidence review paths
      nashir approval/review paths
      nashir scoring mutation/persistence paths
      nashir state-transition paths

security:
  - bearerAuth: []

x-contract-rules:
  source_authority: Nashir Slice 0 planning gate chain (PRs #161 through #167)
  rbac_codes_source: PR #166 (src/rbac.js)
  no_code_before_contracts: true
  global_guards:
    - AuthGuard
    - WorkspaceContextGuard
    - MembershipCheck
    - PermissionGuard
  body_workspace_id_trusted: false
  generated-client: NO-GO
  no_go_rules:
    - workspace_id accepted from body as trusted source
    - endpoint reads or writes workspace-scoped record without workspace path context
    - nashir evidence review paths exposed before separate approval
    - nashir approval/review paths exposed before separate approval
    - nashir scoring mutation or persistence paths exposed before separate approval
    - generated clients updated without separate approval
    - routes registered in src/router.js without route implementation scope gate

x-error-codes:
  PERMISSION_DENIED:
    status: 403
    description: >
      Role does not have the required Nashir permission code.
      permissionGuard throws this when hasPermission returns false for the
      requested nashir.* code.
  WORKSPACE_ACCESS_DENIED:
    status: 403
    description: >
      User is not a member of this workspace. membershipCheck throws this
      when no active membership exists for the requesting user.
  TENANT_CONTEXT_MISMATCH:
    status: 422
    description: >
      workspace_id in request body does not match the route workspace context.
      rejectBodyWorkspaceId throws this when the body contains a conflicting
      workspace_id value.
  NASHIR_IDEMPOTENCY_CONFLICT:
    status: 409
    description: >
      Idempotent operation repeated with a conflicting payload.
      Corresponds to audit event nashir.idempotency.conflict.
  NASHIR_PROCESS_BLOCKED:
    status: 409
    description: >
      Nashir process is blocked pending review or governance action.
      Corresponds to audit event nashir.process.blocked.
  NASHIR_INVALID_STATE_TRANSITION:
    status: 409
    description: >
      Attempted invalid Nashir campaign state transition.

tags:
  - name: NashirCampaigns
    description: >
      Nashir Slice 0 campaign/intake surface. These paths use nashir.campaign.*
      permission codes and are gated separately from the non-Nashir campaign paths.

paths:
  /workspaces/{workspaceId}/nashir-campaigns:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [NashirCampaigns]
      summary: List Nashir campaigns for workspace
      operationId: listNashirCampaigns
      x-permission: nashir.campaign.read
      responses:
        '200':
          description: Nashir campaigns returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NashirCampaignListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [NashirCampaigns]
      summary: Create Nashir campaign intake record
      operationId: createNashirCampaign
      x-permission: nashir.campaign.write
      x-audit-event: nashir_campaign.created
      x-no-go: workspace_id_accepted_from_body_as_trusted_source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNashirCampaignRequest'
      responses:
        '201':
          description: Nashir campaign intake record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NashirCampaignResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /workspaces/{workspaceId}/nashir-campaigns/{nashirCampaignId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/NashirCampaignId'
    get:
      tags: [NashirCampaigns]
      summary: Get Nashir campaign by ID
      operationId: getNashirCampaign
      x-permission: nashir.campaign.read
      responses:
        '200':
          description: Nashir campaign returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NashirCampaignResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /workspaces/{workspaceId}/nashir-campaigns/{nashirCampaignId}/readiness:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/NashirCampaignId'
    get:
      tags: [NashirCampaigns]
      summary: Get advisory Nashir campaign readiness
      operationId: getNashirCampaignReadiness
      x-permission: nashir.campaign.read
      responses:
        '200':
          description: Advisory Nashir campaign readiness returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NashirCampaignReadinessResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /workspaces/{workspaceId}/nashir-campaigns/{nashirCampaignId}/evidence:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/NashirCampaignId'
    get:
      tags: [NashirCampaigns]
      summary: List Nashir campaign lifecycle evidence records
      operationId: listNashirCampaignEvidence
      x-operationId-note: >
        listNashirCampaignEvidence existed before the lifecycle read/list patch.
        This patch updates the existing list contract in place and does not add a
        duplicate operationId. The new get-by-id lifecycle read operation uses
        the non-conflicting getNashirCampaignEvidence operationId.
      x-permission: nashir.campaign.read
      x-no-request-body: true
      x-route-derived-scope:
        - workspaceId
        - nashirCampaignId
      responses:
        '200':
          description: Submitted in-memory Nashir evidence list returned; lifecycle-aware read/list contract remains route-derived by workspace and campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NashirCampaignEvidenceListResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [NashirCampaigns]
      summary: Submit in-memory Nashir campaign evidence
      operationId: submitNashirCampaignEvidence
      x-permission: nashir.campaign.write
      x-audit-event: nashir_evidence.submitted
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitNashirCampaignEvidenceRequest'
      responses:
        '201':
          description: In-memory Nashir evidence submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NashirCampaignEvidenceResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /workspaces/{workspaceId}/nashir-campaigns/{nashirCampaignId}/evidence/{evidenceId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/NashirCampaignId'
      - $ref: '#/components/parameters/EvidenceId'
    get:
      tags: [NashirCampaigns]
      summary: Get Nashir campaign lifecycle evidence by ID
      operationId: getNashirCampaignEvidence
      x-permission: nashir.campaign.read
      x-no-request-body: true
      x-route-derived-scope:
        - workspaceId
        - nashirCampaignId
        - evidenceId
      x-generic-404: >
        Non-existent evidence, cross-workspace evidence, and cross-campaign
        evidence all return generic 404 Not Found without resource-existence
        disclosure.
      responses:
        '200':
          description: Nashir evidence lifecycle record returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NashirCampaignLifecycleEvidenceResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: >
        Workspace context identifier. Must be authorized by route path.
        Must not be trusted from request body (body_workspace_id_trusted: false).

    NashirCampaignId:
      name: nashirCampaignId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Nashir campaign record identifier.

    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: >
        Route-derived Nashir evidence identifier. Must only be resolved inside
        the route-derived workspaceId and nashirCampaignId scope.

  schemas:
    NashirCampaign:
      type: object
      required:
        - nashir_campaign_id
        - workspace_id
        - campaign_name
        - campaign_status
        - created_at
      properties:
        nashir_campaign_id:
          type: string
          format: uuid
          description: Nashir campaign record identifier.
        workspace_id:
          type: string
          format: uuid
          description: >
            Route-derived workspace context. Populated from the {workspaceId}
            route parameter. Never accepted from the request body as trusted input.
        campaign_name:
          type: string
          description: Name of the Nashir campaign intake record.
        campaign_status:
          type: string
          enum:
            - draft
            - submitted_for_review
            - approved
            - rejected
            - archived
          description: Current campaign lifecycle state.
        created_at:
          type: string
          format: date-time
        updated_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"

    CreateNashirCampaignRequest:
      type: object
      required:
        - campaign_name
      additionalProperties: false
      properties:
        campaign_name:
          type: string
          description: Name of the Nashir campaign intake record.
      x-rule: >
        workspace_id must not appear in this request body. Workspace authority
        is derived exclusively from the {workspaceId} route parameter.
        rejectBodyWorkspaceId must be called before any state mutation.

    NashirCampaignResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/NashirCampaign'

    NashirCampaignListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NashirCampaign'

    ReadinessIssue:
      type: object
      required:
        - code
        - message
        - severity
      properties:
        code:
          type: string
        message:
          type: string
        severity:
          type: string
          enum:
            - blocker
            - warning
        field:
          oneOf:
            - type: string
            - type: "null"
        user_action:
          oneOf:
            - type: string
            - type: "null"

    ReadinessMissingField:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string
        user_action:
          oneOf:
            - type: string
            - type: "null"

    ReadinessExplanation:
      type: object
      required:
        - code
        - message
        - related_fields
      properties:
        code:
          type: string
        message:
          type: string
        related_fields:
          type: array
          items:
            type: string

    NashirCampaignReadiness:
      type: object
      required:
        - nashir_campaign_id
        - workspace_id
        - readiness_level
        - gate_state
        - blockers
        - warnings
        - missing_fields
        - explanations
        - evaluated_at
      properties:
        nashir_campaign_id:
          type: string
        workspace_id:
          type: string
          description: Route-derived workspace context.
        readiness_level:
          type: string
          enum:
            - pass
            - soft_pass
            - fail
            - blocked_until_review
        gate_state:
          type: string
          enum:
            - advisory_only
            - blocked_until_review
            - ready_for_human_review
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessIssue'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessIssue'
        missing_fields:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessMissingField'
        explanations:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessExplanation'
        evaluated_at:
          type: string
          format: date-time
          description: Runtime evaluation timestamp. Readiness output is not persisted.

    NashirCampaignReadinessResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/NashirCampaignReadiness'

    NashirCampaignEvidenceListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          description: >
            Evidence lifecycle list for the route-derived workspace and Nashir
            campaign. Runtime route implementation remains separately gated.
          items:
            $ref: '#/components/schemas/NashirCampaignLifecycleEvidence'

    SubmitNashirCampaignEvidenceRequest:
      type: object
      required:
        - evidenceType
        - channel
      additionalProperties: false
      properties:
        evidenceType:
          type: string
        channel:
          type: string
        publishedAt:
          type: string
          format: date-time
        url:
          type: string
          minLength: 1
        notes:
          type: string
          minLength: 1
        externalReference:
          type: string
          minLength: 1
      anyOf:
        - required: [url]
        - required: [externalReference]
        - required: [notes]
      x-rule: >
        workspaceId and nashirCampaignId are derived exclusively from the route.
        This in-memory slice does not implement campaignVersionId or assetVersionId.

    NashirCampaignEvidence:
      type: object
      required:
        - id
        - workspaceId
        - nashirCampaignId
        - evidenceType
        - channel
        - status
        - submittedAt
        - submittedBy
      properties:
        id:
          type: string
        workspaceId:
          type: string
          description: Route-derived workspace context.
        nashirCampaignId:
          type: string
          description: Route-derived Nashir campaign identifier.
        evidenceType:
          type: string
        channel:
          type: string
        status:
          type: string
          enum:
            - submitted
        submittedAt:
          type: string
          format: date-time
        submittedBy:
          type: string
        publishedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        url:
          oneOf:
            - type: string
            - type: "null"
        notes:
          oneOf:
            - type: string
            - type: "null"
        externalReference:
          oneOf:
            - type: string
            - type: "null"

    NashirCampaignEvidenceResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/NashirCampaignEvidence'

    NashirCampaignLifecycleEvidence:
      type: object
      required:
        - id
        - workspaceId
        - nashirCampaignId
        - evidenceType
        - channel
        - status
        - submittedByUserId
        - submittedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
          description: Route-derived workspace context.
        nashirCampaignId:
          type: string
          format: uuid
          description: Route-derived Nashir campaign identifier.
        evidenceType:
          type: string
        channel:
          type: string
        status:
          type: string
          enum:
            - submitted
            - accepted
            - rejected
            - invalidated
            - superseded
        submittedByUserId:
          type: string
          format: uuid
        submittedAt:
          type: string
          format: date-time
        publishedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        url:
          oneOf:
            - type: string
            - type: "null"
        notes:
          oneOf:
            - type: string
            - type: "null"
        externalReference:
          oneOf:
            - type: string
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      x-rule: >
        workspaceId and nashirCampaignId are route-derived trusted scope.
        Request body overrides are forbidden. GET request bodies are forbidden.

    NashirCampaignLifecycleEvidenceResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/NashirCampaignLifecycleEvidence'

    ErrorModel:
      type: object
      required: [code, message, user_action, correlation_id]
      properties:
        code:
          type: string
          description: >
            Machine-readable error code. Nashir-specific codes:
            PERMISSION_DENIED (403), WORKSPACE_ACCESS_DENIED (403),
            TENANT_CONTEXT_MISMATCH (422), NASHIR_IDEMPOTENCY_CONFLICT (409),
            NASHIR_PROCESS_BLOCKED (409), NASHIR_INVALID_STATE_TRANSITION (409).
          examples:
            - PERMISSION_DENIED
            - WORKSPACE_ACCESS_DENIED
            - TENANT_CONTEXT_MISMATCH
            - NASHIR_IDEMPOTENCY_CONFLICT
            - NASHIR_PROCESS_BLOCKED
            - NASHIR_INVALID_STATE_TRANSITION
        message:
          type: string
          description: Human-readable error description.
        user_action:
          type: string
          description: Suggested corrective action for the caller.
        correlation_id:
          type: string
          description: Request correlation identifier for traceability.

  responses:
    ErrorResponse:
      description: Error response using ErrorModel shape
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
